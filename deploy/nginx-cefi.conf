# api.cefi.vn — nginx front for the CeFi API of the zxstim-api production stack
# (container port 8001, published on 127.0.0.1:8005).
#
# Lives on the zxstim-rpc server as /etc/nginx/sites-available/zxstim-cefi
# (symlinked into sites-enabled), next to zxstim-rpc and zxstim-api. Not
# deployed by CI: copy it by hand and `nginx -t && systemctl reload nginx`.
#
# Same site as the web app (cefi.vn / sim.cefi.vn), so the session cookie is
# first-party. The app trusts X-Real-IP for rate limits and sign-up limits, so
# nginx always overwrites it and clears X-Forwarded-For. access_log is off
# box-wide (nginx.conf); errors log at crit only.
#
# Certificate (cert name api.cefi.vn) via certbot's webroot plugin; DNS must
# point at this box and the port-80 block must be live first:
#   certbot certonly --webroot -w /var/www/letsencrypt -d api.cefi.vn --cert-name api.cefi.vn

upstream zxstim_cefi {
    server 127.0.0.1:8005;
    keepalive 16;
}

# WebSocket upgrade when asked for (future live order-book feeds); otherwise
# an empty Connection header so upstream keepalive works.
map $http_upgrade $zxstim_cefi_connection {
    default upgrade;
    ''      "";
}

# HTTP: ACME renewals, everything else → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.cefi.vn;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.cefi.vn;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/api.cefi.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cefi.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    location / {
        proxy_pass http://zxstim_cefi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Client identity for rate limits: always the real peer, never client-supplied.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zxstim_cefi_connection;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
