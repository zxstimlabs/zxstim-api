# zxstim-api: the app (SQLite DB on a named volume) and the Redis that stores
# the ETH/VND order book.
#
#   Run a published image:    IMAGE=ghcr.io/zxstimlabs/zxstim-api:<tag> docker compose -f deploy/compose.yaml up -d
#   Build from this checkout: docker compose -f deploy/compose.yaml up -d --build
#   Second copy side by side: add `-p <other-name>` and HOST_PORT=<other-port>
#
# Runs on the zxstim-rpc server next to the eth-rpc stacks, which hold
# 127.0.0.1:8001 (prod) and 8002 (develop). This stack: 8003 (prod) and 8004
# (develop).
#
# Secrets come from .env next to this file (written by CI, mode 600), never
# from the image. HOST, PORT and DATABASE_PATH are set in the image.
#
# The DB lives in the volume <project>_data and the order book in
# <project>_redis-data. `up`, `restart` and deploys keep both; `down -v`
# deletes them (develop teardown does that on purpose).

name: zxstim-api

services:
  # Order-book store (src/modules/orderbook). Unlike eth-rpc's counters-only
  # Redis, this one persists: append-only file, fsync every second, on its own
  # volume, so the book survives restarts of either container. noeviction:
  # never silently drop book state. No `ports:` — only this stack reaches it.
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    cpus: 0.5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

  app:
    image: ${IMAGE:-zxstim-api:local}
    build:
      context: ..
      target: runtime
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      # CeFi API (api.cefi.vn) on container port 8001. Needs BETTER_AUTH_SECRET
      # and CEFI_PIN_PEPPER in .env; the app refuses to start without them.
      CEFI_ENABLED: "1"
    depends_on:
      redis:
        condition: service_healthy
    # A tiny init as PID 1 so SIGTERM stops the app at once on deploys,
    # instead of waiting out stop_grace_period.
    init: true
    # Localhost only; nginx on the host terminates TLS and proxies here.
    # CEFI_HOST_PORT comes from .env (the workflow writes it): 8005 prod, 8006 develop.
    ports:
      - "127.0.0.1:${HOST_PORT:-8003}:8000"
      - "127.0.0.1:${CEFI_HOST_PORT:-8005}:8001"
    volumes:
      - data:/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # Shares the box with the RPC proxy and has no rate limiting of its own:
    # cap it so a flood here can't starve the proxy.
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data: {}
  redis-data: {}
