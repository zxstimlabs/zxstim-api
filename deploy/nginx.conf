# api.zxstim.com — nginx front for the zxstim-api production stack (127.0.0.1:8003).
#
# Lives on the zxstim-rpc server as /etc/nginx/sites-available/zxstim-api
# (symlinked into sites-enabled), next to eth-rpc's /etc/nginx/sites-available/zxstim-rpc,
# whose default_server already drops unknown hostnames. Not deployed by CI:
# copy it by hand and `nginx -t && systemctl reload nginx`.
#
# The box's nginx.conf turns access_log off globally and logs errors at crit only.
#
# The certificate (cert name api.zxstim.com) comes from certbot's webroot
# plugin. Issuing it needs DNS pointing at this box and the port-80 block
# live, so on first setup install the port-80 server alone, then run
#   certbot certonly --webroot -w /var/www/letsencrypt -d api.zxstim.com --cert-name api.zxstim.com
# and then install this whole file.

upstream zxstim_api {
    server 127.0.0.1:8003;
    keepalive 16;
}

# WebSocket upgrade when asked for; otherwise an empty Connection header so
# upstream keepalive works.
map $http_upgrade $zxstim_api_connection {
    default upgrade;
    ''      "";
}

# HTTP: ACME renewals, everything else → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.zxstim.com;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.zxstim.com;
    access_log off;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate     /etc/letsencrypt/live/api.zxstim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zxstim.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;

    location / {
        proxy_pass http://zxstim_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zxstim_api_connection;
        # Long timeouts so idle /pools/:id/ws connections aren't culled.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
